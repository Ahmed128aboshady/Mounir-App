name: Application checks
on: [push, pull_request]
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Check application JavaScript
        run: |
          node --check local_live/assets/live.js
          node --check local_live/assets/supervisor.js
          node --check local_live/assets/cloud-mode.js
          node --check frontend/js/supabase_client.js
